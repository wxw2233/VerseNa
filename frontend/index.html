<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <style id="theme-preload">
    :root { --panel-l1: transparent !important; --panel-l2: transparent !important; --panel-l3: transparent !important; --panel-l4: transparent !important; --sidebar-bg: transparent !important; --bubble-agent: rgba(20,20,40,0.25) !important; --bubble-user: rgba(20,20,40,0.25) !important; --bg-opacity: 0.3 !important; --input-bg: rgba(25,25,48,0.55) !important; }
    body { background: #0a0a18; }
  </style>
  <script>
    // 同步阻塞加载用户主题，防止刷新时闪默认界面
    (function() {
      try {
        var saved = localStorage.getItem('current-theme');
        if (saved && saved !== 'default' && saved !== 'null') {
          var xhr = new XMLHttpRequest();
          xhr.open('GET', '/api/themes/' + saved + '/css?t=' + Date.now(), false);
          xhr.send();
          if (xhr.status === 200 && xhr.responseText) {
            var s = document.createElement('style');
            s.id = 'theme-style';
            s.textContent = xhr.responseText;
            document.head.appendChild(s);
          }
        }
        // 恢复用户保存的颜色覆盖
        try {
          var ov = JSON.parse(localStorage.getItem('theme-color-overrides') || '{}');
          for (var k in ov) { document.documentElement.style.setProperty(k, ov[k]); }
        } catch(e2) {}
      } catch(e) {}
    })();
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>次元人格</title>
</head>
<body>
  
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
